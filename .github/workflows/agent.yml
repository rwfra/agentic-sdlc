name: Agent
on:
  issues:
    types: [labeled]
jobs:
  assign-copilot:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate Agent Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Assign issue to Copilot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPO/issues/$ISSUE_NUMBER/assignees" \
            --input - <<EOF
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "$REPO",
              "base_branch": "main",
              "custom_instructions": "Fill in every field of the plan in .github/pull_request_template.md in the PR description.",
              "custom_agent": "",
              "model": ""
            }
          }
          EOF
