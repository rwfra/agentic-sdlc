name: CI Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
defaults:
  run:
    working-directory: ./study-board
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ./study-board/.nvmrc
          cache: 'npm'
          cache-dependency-path: ./study-board/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: study-board-dist
          path: ./study-board/dist
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: study-board-dist
          path: dist
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: studyboard
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist
